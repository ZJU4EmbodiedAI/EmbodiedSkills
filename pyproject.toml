[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiedskills"
version = "0.3.0"
description = "World Action Model-augmented cascaded skills for vision-language-action agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
encoders = ["transformers>=4.56,<5", "pillow>=10"]

[project.scripts]
embodiedskills = "embodiedskills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
